<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Desk ER Diagram</title>
<style>
:root{
  --bg:#f4f5f8; --panel:#ffffff; --card:#ffffff; --card-head:#f3f4f7; --line:#e1e4ea; --line-strong:#c9ced8;
  --text:#18202e; --muted:#667085; --faint:#98a2b3;
  --edge:#b4bcc9; --accent:#2f5bea; --accent-soft:#e3eafd; --soft:#b26b00; --soft-bg:#fff4e0; --warn:#c2410c;
  --grid:#e3e6ec; --flash:#fff0b3; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.05);
  --g0:#475467; --g1:#2f5bea; --g2:#0e9384; --g3:#7a3fe0; --g4:#c11574; --g5:#dc6803; --g6:#0086c9; --g7:#4e5ba6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1017; --panel:#141821; --card:#181d27; --card-head:#1f2531; --line:#2a3140; --line-strong:#3a4356;
    --text:#e6e9ef; --muted:#98a2b3; --faint:#667085;
    --edge:#4a5366; --accent:#7196ff; --accent-soft:#1c2744; --soft:#f5b54a; --soft-bg:#33260d; --warn:#fb923c;
    --grid:#171c25; --flash:#4d3f0f; --shadow:0 1px 2px rgba(0,0,0,.4);
    --g0:#98a2b3; --g1:#7196ff; --g2:#2ed3b7; --g3:#a58bfa; --g4:#f472b6; --g5:#fdb022; --g6:#36bffa; --g7:#8098f9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1017; --panel:#141821; --card:#181d27; --card-head:#1f2531; --line:#2a3140; --line-strong:#3a4356;
  --text:#e6e9ef; --muted:#98a2b3; --faint:#667085;
  --edge:#4a5366; --accent:#7196ff; --accent-soft:#1c2744; --soft:#f5b54a; --soft-bg:#33260d; --warn:#fb923c;
  --grid:#171c25; --flash:#4d3f0f; --shadow:0 1px 2px rgba(0,0,0,.4);
  --g0:#98a2b3; --g1:#7196ff; --g2:#2ed3b7; --g3:#a58bfa; --g4:#f472b6; --g5:#fdb022; --g6:#36bffa; --g7:#8098f9;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:260px 1fr 0;grid-template-rows:52px 1fr;height:100vh;transition:grid-template-columns .2s}
#app.open{grid-template-columns:260px 1fr 430px}
/* top bar */
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
header h1{font-size:14px;margin:0;white-space:nowrap}
header .stats{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;margin-left:auto;flex:none}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
#themeBtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:30px;cursor:pointer;flex:none}
/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
#list{overflow:auto;flex:1;padding:4px 0 16px}
.grp{padding:12px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.item{display:flex;justify-content:space-between;gap:8px;padding:4px 14px 4px 30px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:12px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace}
.item:hover{background:var(--card-head)}
.item.active{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 var(--accent)}
.item.rel{color:var(--accent)}
.item span:last-child{color:var(--faint);font-size:11px}
.opts{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:7px;font-size:12px}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
/* canvas */
main{position:relative;min-width:0;overflow:hidden}
svg#er{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
svg#er.panning{cursor:grabbing}
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;z-index:2;align-items:center;pointer-events:none}
.toolbar>*{pointer-events:auto}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:var(--shadow)}
.seg button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#trail{display:flex;gap:4px;align-items:center;overflow:hidden;margin-left:8px;min-width:0;flex:1}
#trail button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 9px;font:11px ui-monospace,Consolas,monospace;cursor:pointer;white-space:nowrap;color:var(--muted)}
#trail button:hover{color:var(--accent);border-color:var(--accent)}
#trail button.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#trail .sep{color:var(--faint);font-size:11px}
.legend{position:absolute;bottom:12px;left:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;z-index:2;box-shadow:var(--shadow);max-width:calc(100% - 250px)}
.legend svg{vertical-align:middle;margin-right:4px}
#mini{position:absolute;bottom:12px;right:12px;width:210px;height:130px;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:2;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
#mini svg{width:100%;height:100%;display:block}
#mini .vw{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
/* svg elements */
.gbg{fill:var(--panel);fill-opacity:.55;stroke:var(--line);stroke-dasharray:4 4}
.glabel{font:700 13px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.gcount{font:12px system-ui,sans-serif;fill:var(--faint)}
.card{cursor:pointer;transition:opacity .15s}
.card .shadow{fill:#101828;opacity:.06}
.card .box{fill:var(--card);stroke:var(--line-strong);stroke-width:1}
.card .head{fill:var(--card-head)}
.card .tname{font:700 12.5px ui-monospace,"Cascadia Code",Consolas,monospace;fill:var(--text)}
.card .cname{font:11.5px ui-monospace,"Cascadia Code",Consolas,monospace;fill:var(--text)}
.card .cname.null{fill:var(--muted)}
.card .ctype{font:10.5px ui-monospace,Consolas,monospace;fill:var(--faint)}
.card .kb{font:700 8.5px system-ui,sans-serif}
.card .more{font:italic 11px system-ui,sans-serif;fill:var(--faint)}
.card .row rect{fill:transparent}
.card .row:hover rect{fill:var(--accent-soft)}
.card .row.fk .cname{fill:var(--accent)}
.card .row.lr .cname{fill:var(--soft)}
.card .row.flash rect{fill:var(--flash)}
.card:hover .box{stroke:var(--accent)}
.card.sel .box{stroke:var(--accent);stroke-width:2.5}
.card.rel .box{stroke:var(--accent);stroke-width:1.5}
.edge{fill:none;stroke:var(--edge);stroke-width:1.3;transition:opacity .15s}
.edge .mk{stroke-dasharray:none}
.edge.soft{stroke:var(--soft);stroke-dasharray:5 4}
.edge.hi{stroke:var(--accent);stroke-width:2.2}
.edge.soft.hi{stroke:var(--soft)}
.dimmed .card:not(.sel):not(.rel){opacity:.16}
.dimmed .edge:not(.hi){opacity:.06}
/* mappings view */
#mapView{position:absolute;inset:0;overflow:auto;padding:20px 24px 40px;display:none;background:var(--bg)}
#app.maps #mapView{display:block}
#app.maps svg#er,#app.maps .toolbar,#app.maps .legend,#app.maps #mini{display:none}
.mapHead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.mapHead h2{font-size:16px;margin:0}
.mapHead p{margin:0;color:var(--muted);font-size:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
.filters button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
table.maps{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
table.maps th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--card-head);padding:8px 10px;position:sticky;top:-20px;z-index:1}
table.maps td{border-top:1px solid var(--line);padding:7px 10px;vertical-align:top}
table.maps tr:hover td{background:var(--card-head)}
table.maps .ref{font-family:ui-monospace,Consolas,monospace}
table.maps .ref b{font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.t-fk{background:var(--accent-soft);color:var(--accent)}
.t-lr{background:var(--soft-bg);color:var(--soft)}
.t-ok{color:var(--g2)}
.t-no{color:var(--warn)}
/* detail panel */
#panel{background:var(--panel);border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.panel-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.panel-head h2{font:700 14px ui-monospace,Consolas,monospace;margin:0;word-break:break-all;flex:1}
.panel-head button{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:30px;height:28px;cursor:pointer}
.panel-body{overflow:auto;padding:12px 16px 28px;flex:1}
.meta{color:var(--muted);font-size:12px;margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px}
.desc{margin:6px 0 4px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 7px}
table.cols{width:100%;border-collapse:collapse;font-size:12px}
table.cols td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
table.cols tr.flash td{background:var(--flash)}
table.cols .n{font-family:ui-monospace,Consolas,monospace;font-weight:600;word-break:break-all}
table.cols .t{color:var(--faint);font-family:ui-monospace,Consolas,monospace;font-size:11px;white-space:nowrap}
.badge{display:inline-block;font-size:9.5px;font-weight:700;border-radius:3px;padding:0 4px;margin:0 0 0 3px;border:1px solid currentColor}
.b-pk{color:var(--g5)} .b-fk{color:var(--accent)} .b-nn{color:var(--muted)} .b-uq{color:var(--g3)} .b-lr{color:var(--soft)}
.sub{color:var(--muted);font-size:11px;word-break:break-word;margin-top:2px}
.sub code{font-family:ui-monospace,Consolas,monospace}
.lnk{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.lnk:hover{text-decoration:underline}
.rels{display:grid;gap:5px}
.relbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--bg);cursor:pointer;text-align:left;font:11.5px ui-monospace,Consolas,monospace;width:100%}
.relbtn:hover{border-color:var(--accent)}
.relbtn .card-t{font-weight:700}
.relbtn .muted{color:var(--muted)}
.relbtn .tag{margin-left:auto;font-family:system-ui,sans-serif}
.idx{font:11.5px ui-monospace,Consolas,monospace;padding:5px 0;border-top:1px solid var(--line)}
.empty{color:var(--muted);font-size:12px}
.warn{color:var(--warn)}
#menuBtn{display:none}
@media (max-width:900px){
  #app,#app.open{grid-template-columns:1fr}
  header .stats{display:none}
  aside{position:fixed;top:52px;bottom:0;left:0;width:270px;z-index:10;transform:translateX(-100%);transition:transform .2s}
  #app.menu aside{transform:none}
  #panel{position:fixed;inset:auto 0 0 0;height:55vh;z-index:9;border-left:0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .2s}
  #app.open #panel{transform:none}
  #menuBtn{display:inline-block}
  #mini,#trail{display:none}
  .legend{max-width:calc(100% - 24px)}
  #mapView{padding:14px 16px 40px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menuBtn" class="btn" title="Tables">☰</button>
    <h1>Support Desk · ER diagram</h1>
    <span class="stats" id="stats"></span>
    <div class="tabs" role="tablist">
      <button id="tabDiagram" class="on" role="tab">Diagram</button>
      <button id="tabMaps" role="tab">Mappings</button>
    </div>
    <button id="themeBtn" title="Toggle light/dark">◐</button>
  </header>
  <aside>
    <div class="search"><input id="q" type="search" placeholder="Filter tables or columns…  ( / )" autocomplete="off"></div>
    <nav id="list"></nav>
    <div class="opts">
      <label><input type="checkbox" id="optSoft" checked> Logical links (not enforced)</label>
      <label><input type="checkbox" id="optOrg"> Org_Id links (every table)</label>
    </div>
  </aside>
  <main>
    <div class="toolbar">
      <div class="seg"><button id="modeKeys" class="on" title="Show key columns only">Keys</button><button id="modeAll" title="Show every column">All columns</button></div>
      <button class="btn" id="zin" title="Zoom in">＋</button>
      <button class="btn" id="zout" title="Zoom out">－</button>
      <button class="btn" id="fit" title="Fit whole diagram">Fit</button>
      <div id="trail"></div>
    </div>
    <svg id="er" aria-label="Entity relationship diagram">
      <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--grid)"/></pattern>
        <clipPath id="headClip"><rect width="286" height="36" rx="10"/></clipPath></defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <g id="vp"><g id="groups"></g><g id="edges"></g><g id="cards"></g></g>
    </svg>
    <div class="legend">
      <span><svg width="46" height="12"><path d="M2 6H44M2 1L10 6L2 11M13 1V11M36 1V11M40 1V11" stroke="var(--edge)" fill="none" stroke-width="1.5"/></svg>many → exactly one</span>
      <span><svg width="46" height="12"><path d="M2 6H33M2 1L10 6L2 11M13 1V11M42 1V11" stroke="var(--edge)" fill="none" stroke-width="1.5"/><circle cx="37" cy="6" r="3.2" fill="var(--card)" stroke="var(--edge)" stroke-width="1.5"/></svg>many → zero or one</span>
      <span><svg width="46" height="12"><path d="M2 6H44M8 1V11M36 1V11M40 1V11" stroke="var(--edge)" fill="none" stroke-width="1.5"/></svg>one → one</span>
      <span><svg width="46" height="12"><path d="M2 6H44" stroke="var(--soft)" stroke-width="1.5" stroke-dasharray="5 4"/></svg>logical link</span>
    </div>
    <div id="mini" title="Click to jump"><svg id="miniSvg"></svg></div>
    <section id="mapView"></section>
  </main>
  <section id="panel" aria-live="polite"></section>
</div>
<script>

cket_Id","type":"TEXT","nn":1,"fk":{"table":"HD_TICKET_MASTER","column":"Ticket_Id"}},{"name":"Started_Time","type":"TEXT","nn":1},{"name":"Ended_Time","type":"TEXT"},{"name":"Status_At_Start","type":"TEXT","nn":1},{"name":"Status_At_End","type":"TEXT"},{"name":"Started_By","type":"TEXT","fk":{"table":"HD_AGENT_MASTER","column":"Agent_Id"}},{"name":"Ended_By","type":"TEXT","fk":{"table":"HD_AGENT_MASTER","column":"Agent_Id"}},{"name":"Created_By","type":"TEXT","nn":1},{"name":"Created_Time","type":"TEXT","nn":1,"def":"(strftime('%Y-%m-%dT%H:%M:%f+05:30', 'now', '+330 minutes'))"},{"name":"Modified_By","type":"TEXT"},{"name":"Modified_Time","type":"TEXT"},{"name":"Is_Deleted","type":"TEXT","nn":1,"def":"'N'","check":"Is_Deleted IN ('Y', 'N')"},{"name":"Org_Id","type":"TEXT","nn":1,"fk":{"table":"HD_ORGANIZATION_MASTER","column":"Organization_Id"}}],"indexes":[{"name":"idx_clock_segment_ticket","unique":false,"cols":"Ticket_Id","where":""},{"name":"uq_clock_segment_open","unique":true,"cols":"Ticket_Id","where":"Ended_Time IS NULL AND Is_Deleted = 'N'"}],"checks":[]},{"name":"HD_ESCALATION_LEVEL","file":"0022_hd_escalation_level.sql","desc":"admin-managed escalation matrix (Config page). For each priority, level N is reached Offset_Hours from the ticket's SLA due date (Response_Due_Date): negative = before due (\"nearing\"), 0 = at due, positive = after due. Hours are counted on the bank's SLA working-day calendar. Offsets must increase with Level_No within a priority, so a higher level is always reached later. Any number of levels.","columns":[{"name":"Escalation_Level_Id","type":"TEXT","pk":1,"nn":1},{"name":"Priority","type":"TEXT","nn":1},{"name":"Level_No","type":"INTEGER","nn":1,"check":"Level_No >= 1"},{"name":"Offset_Hours","type":"REAL","nn":1},{"name":"Created_By","type":"TEXT"},{"name":"Created_Time","type":"TEXT","nn":1,"def":"(strftime('%Y-%m-%dT%H:%M:%f+05:30', 'now', '+330 minutes'))"},{"name":"Modified_By","type":"TEXT"},{"name":"Modified_Time","type": r ticket tracking. Department_Id is the assignee's team at the time of assignment. Seen_Time is set when the assignee first opens the ticket, so My Tickets can flag new assignments. Each assignment is that person's piece of work on the ticket. Work_State is its current state (every stretch is logged in HD_ASSIGNMENT_STATE_LOG): PENDING (assigned, not started - waiting for handover), WAITING (blocked by another assignee's work, see HD_ASSIGNMENT_DEPENDENCY), READY (unblocked, not started), IN_PROGRESS, ON_HOLD (waiting on the bank / information), DONE. Round_No counts the rounds a team has had on this ticket (Java, back to support, Java again = Java round 2).","columns":[{"name":"Assignment_Id","type":"TEXT","pk":1,"nn":1},{"name":"Ticket_Id","type":"TEXT","nn":1,"fk":{"table":"HD_TICKET_MASTER","column":"Ticket_Id"}},{"name":"Agent_Id","type":"TEXT","nn":1,"fk":{"table":"HD_AGENT_MASTER","column":"Agent_Id"}},{"name":"Department_Id","type":"TEXT","fk":{"table":"HD_DEPARTMENT_MASTER","column":"Department_Id"}},{"name":"Is_Cross_Team","type":"TEXT","nn":1,"def":"'N'","check":"Is_Cross_Team IN ('Y', 'N')"},{"name":"Assigned_By","type":"TEXT","fk":{"table":"HD_AGENT_MASTER","column":"Agent_Id"}},{"name":"Assigned_Time","type":"TEXT","nn":1},{"name":"Note","type":"TEXT"},{"name":"Work_State","type":"TEXT","nn":1,"def":"'PENDING'","check":"Work_State IN ('PENDING', 'WAITING', 'READY', 'IN_PROGRESS', 'ON_HOLD', 'DONE')"},{"name":"Round_No","type":"INTEGER","nn":1,"def":"1","check":"Round_No >= 1"},{"name":"Seen_Time","type":"TEXT"},{"name":"Released_By","type":"TEXT","fk":{"table":"HD_AGENT_MASTER","column":"Agent_Id"}},{"name":"Released_Time","type":"TEXT"},{"name":"Created_Time","type":"TEXT","nn":1,"def":"(strftime('%Y-%m-%dT%H:%M:%f+05:30', 'now', '+330 minutes'))"},{"name":"Org_Id","type":"TEXT","nn":1,"fk":{"table":"HD_ORGANIZATION_MASTER","column":"Organization_Id"}}],"indexes":[{"name":"idx_assignment_ticket","unique":false,"cols":"Ticket_Id","where":""},{"name":"i // Relationships the database does not enforce but the code relies on (verified in server/src).
const SOFT = [
  {from:'HD_TICKET_MASTER', col:'Product_Id', to:'HD_PRODUCT_MASTER', tcol:'Product_Id', note:'Plain TEXT: the product table is created later in migration order'},
  {from:'HD_TICKET_COMMENT', col:'Assignment_Id', to:'HD_TICKET_ASSIGNMENT', tcol:'Assignment_Id', note:'Plain TEXT: the assignment table is created later in migration order'},
  {from:'HD_TICKET_MASTER', col:'Priority', to:'HD_PRIORITY_SLA_CONFIG', tcol:'Priority', note:'Matched by text; Sla_Hours sets Response_Due_Date'},
  {from:'HD_ESCALATION_LEVEL', col:'Priority', to:'HD_PRIORITY_SLA_CONFIG', tcol:'Priority', note:'Escalation levels are defined per priority text'},
  {from:'HD_TICKET_ESCALATION', col:'Level_No', to:'HD_ESCALATION_LEVEL', tcol:'Level_No', note:"Level of the ticket's priority, rebuilt by escalation.service"},
  {from:'HD_TICKET_MASTER', col:'Status', to:'HD_PICKLIST_VALUE', tcol:'Value', note:"Field = 'STATUS'"},
  {from:'HD_TICKET_MASTER', col:'Classification', to:'HD_PICKLIST_VALUE', tcol:'Value', note:"Field = 'CLASSIFICATION'"},
  {from:'HD_TICKET_MASTER', col:'Category', to:'HD_PICKLIST_VALUE', tcol:'Value', note:"Field = 'CATEGORY'"},
  {from:'HD_TICKET_MASTER', col:'Sub_Category', to:'HD_PICKLIST_VALUE', tcol:'Value', note:"Field = 'SUB_CATEGORY'"},
  {from:'HD_TICKET_CLOCK_SEGMENT', col:'Status_At_Start', to:'HD_PICKLIST_VALUE', tcol:'Value', note:"STATUS value when the clock started"},
  {from:'HD_TICKET_CLOCK_SEGMENT', col:'Status_At_End', to:'HD_PICKLIST_VALUE', tcol:'Value', note:"STATUS value when the clock stopped"},
  {from:'HD_DEPARTMENT_MASTER', col:'Team_Type', to:'HD_PICKLIST_VALUE', tcol:'Value', note:"Field = 'TEAM_TYPE'"},
  {from:'HD_PICKLIST_VALUE', col:'Parent_Value', to:'HD_PICKLIST_VALUE', tcol:'Value', note:"A CATEGORY row's owning CLASSIFICATION value"},
  {from:'HD_HOLIDAY_WORK', col:'Holiday_Date', to:'HD_HOLIDAY', tcol:'Holiday_Date', note:'The timer only starts on a date listed in HD_HOLIDAY'},
];

// Columns are ordered so the ticket sits in the middle and each area sits next to what it links to.
const GROUPS = [
  {name:'Access', tables:['HD_ORGANIZATION_MASTER','HD_ROLE_MASTER','HD_AGENT_CREDENTIAL','HD_AUTH_LOGIN_EVENT']},
  {name:'Teams & People', tables:['HD_AGENT_MASTER','HD_DEPARTMENT_MASTER','HD_MAIL_REPLY_ADDRESS','HD_PRODUCT_MASTER']},
  {name:'Banks & Customers', tables:['HD_BANK_MASTER','HD_BANK_RESOURCE_MAP','HD_CONTACT_MASTER']},
  {name:'Ticket', tables:['HD_TICKET_MASTER','HD_TICKET_METRICS','HD_TICKET_REOPEN']},
  {name:'Assignment & Work', tables:['HD_TICKET_ASSIGNMENT','HD_ASSIGNMENT_STATE_LOG','HD_ASSIGNMENT_DEPENDENCY','HD_TICKET_WORKLOG']},
  {name:'Messages & Activity', tables:['HD_TICKET_CONVERSATION','HD_TICKET_THREAD','_GMAIL_INGESTED_MESSAGE','HD_TICKET_ATTACHMENT','HD_TICKET_COMMENT','HD_TICKET_HISTORY']},
  {name:'SLA & Time', tables:['HD_PRIORITY_SLA_CONFIG','HD_ESCALATION_LEVEL','HD_TICKET_ESCALATION','HD_TICKET_CLOCK_SEGMENT','HD_HOLIDAY','HD_HOLIDAY_WORK']},
  {name:'Configuration & System', tables:['HD_PICKLIST_VALUE','HD_APP_SETTING','HD_ID_SEQUENCE']},
];

/* ---------- model ---------- */
const T = Object.fromEntries(SCHEMA.map(t => [t.name, t]));
const placed = new Set(GROUPS.flatMap(g => g.tables));
const extra = SCHEMA.filter(t => !placed.has(t.name)).map(t => t.name);
if (extra.length) GROUPS.push({name:'Other', tables:extra});
GROUPS.forEach((g, gi) => { g.tables = g.tables.filter(n => T[n]); g.color = `var(--g${gi % 8})`; g.tables.forEach(n => T[n].group = gi); });

// A column counts as indexed when it leads an index, after the tenant/field columns every query already filters on.
const firstIndexCols = t => new Set([
  ...t.columns.filter(c => c.pk).map(c => c.name),
  ...t.indexes.flatMap(ix => {
    const cols = ix.cols.split(',').map(s => s.trim().split(/\s+/)[0]), out = [];
    for (const c of cols) { out.push(c); if (c !== 'Org_Id' && c !== 'Field') break; }
    return out;
  }),
]);
// A single-column unique index makes the link one-to-one, unless it is partial on something other than soft delete.
const uniqueCols = t => new Set(t.indexes
  .filter(ix => ix.unique && !ix.cols.includes(',') && (!ix.where || /^Is_Deleted\s*=\s*'N'$/i.test(ix.where)))
  .map(ix => ix.cols.split(/\s+/)[0]));

const RELS = [];
for (const t of SCHEMA) {
  const idx = firstIndexCols(t), uq = uniqueCols(t);
  for (const c of t.columns) if (c.fk && T[c.fk.table])
    RELS.push({from:t.name, col:c.name, to:c.fk.table, tcol:c.fk.column, soft:false, nullable:!c.nn,
      one:uq.has(c.name) || !!c.uq, indexed:idx.has(c.name), org:c.name === 'Org_Id' && c.fk.table === 'HD_ORGANIZATION_MASTER'});
}
for (const s of SOFT) {
  const t = T[s.from]; if (!t || !T[s.to]) continue;
  const c = t.columns.find(c => c.name === s.col); if (!c) continue;
  RELS.push({...s, soft:true, nullable:!c.nn, one:false, indexed:firstIndexCols(t).has(s.col), org:false});
}
const relKey = r => `${r.from}.${r.col}`;
const opt = {all:false, org:false, soft:true};
const visibleRels = () => RELS.filter(r => (opt.org || !r.org) && (opt.soft || !r.soft));

/* ---------- layout ---------- */
const W = 286, HEAD = 36, ROW = 20, GAPY = 30, GAPX = 140, PAD = 30, GHEAD = 46;
let geo = {}, bounds = {w:0, h:0};

function visibleColumns(t) {
  if (opt.all) return t.columns.map(c => c.name);
  const keep = new Set(t.columns.filter(c => c.pk).map(c => c.name));
  visibleRels().forEach(r => { if (r.from === t.name) keep.add(r.col); if (r.to === t.name) keep.add(r.tcol); });
  return t.columns.filter(c => keep.has(c.name)).map(c => c.name);
}

function layout() {
  geo = {};
  const cols = GROUPS.map(g => {
    let h = GHEAD;
    const items = g.tables.map(n => {
      const t = T[n], rows = visibleColumns(t), hidden = t.columns.length - rows.length;
      const ch = HEAD + rows.length * ROW + (hidden ? ROW : 0) + 6;
      const it = {n, rows, hidden, h:ch, off:h}; h += ch + GAPY; return it;
    });
    return {items, h: h - GAPY};
  });
  const maxH = Math.max(...cols.map(c => c.h));
  let x = PAD;
  cols.forEach((c, gi) => {
    const top = PAD + (maxH - c.h) / 2;   // centre each column on the tallest one
    c.items.forEach(it => { geo[it.n] = {x, y: top + it.off, h: it.h, rows: it.rows, hidden: it.hidden}; });
    GROUPS[gi].box = {x: x - 16, y: top, w: W + 32, h: c.h + 16};
    x += W + GAPX;
  });
  bounds = {w: x - GAPX + PAD, h: maxH + PAD * 2 + 16};
}

/* ---------- render ---------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (tag, attrs, parent, s) => { const e = el(tag, attrs, parent); e.textContent = s; return e; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function render() {
  layout();
  const gG = $('#groups'), gC = $('#cards'), rels = visibleRels();
  gG.innerHTML = ''; gC.innerHTML = '';
  GROUPS.forEach(g => {
    el('rect', {class:'gbg', x:g.box.x, y:g.box.y, width:g.box.w, height:g.box.h, rx:16}, gG);
    const l = txt('text', {class:'glabel', x:g.box.x + 16, y:g.box.y + 28, fill:g.color}, gG, g.name);
    txt('text', {class:'gcount', x:g.box.x + g.box.w - 16, y:g.box.y + 28, 'text-anchor':'end'}, gG, `${g.tables.length} table${g.tables.length > 1 ? 's' : ''}`);
  });
  for (const n in geo) {
    const t = T[n], G = geo[n], color = GROUPS[t.group].color;
    const card = el('g', {class:'card', 'data-t':n, transform:`translate(${G.x},${G.y})`}, gC);
    el('rect', {class:'shadow', x:0, y:3, width:W, height:G.h, rx:10}, card);
    el('rect', {class:'box', width:W, height:G.h, rx:10}, card);
    el('path', {class:'head', d:`M0 10a10 10 0 0 1 10-10h${W - 20}a10 10 0 0 1 10 10v${HEAD - 10}h-${W}z`}, card);
    el('rect', {width:W, height:4, fill:color, 'clip-path':'url(#headClip)'}, card);
    txt('text', {class:'tname', x:12, y:24}, card, n);
    txt('text', {class:'ctype', x:W - 10, y:24, 'text-anchor':'end'}, card, t.columns.length);
    txt('title', {}, card, t.desc || n);
    G.rows.forEach((cn, i) => {
      const c = t.columns.find(c => c.name === cn), out = rels.find(r => r.from === n && r.col === cn);
      const row = el('g', {class:'row' + (out ? (out.soft ? ' lr' : ' fk') : ''), 'data-c':cn, transform:`translate(0,${HEAD + i * ROW})`}, card);
      el('rect', {x:1, y:1, width:W - 2, height:ROW - 1}, row);
      const keys = [];
      if (c.pk) keys.push(['PK', 'var(--g5)']);
      if (c.fk) keys.push(['FK', 'var(--accent)']);
      else if (out && out.soft) keys.push(['LR', 'var(--soft)']);
      keys.forEach(([k, col], ki) => txt('text', {class:'kb', x:10 + ki * 17, y:14, fill:col}, row, k));
      txt('text', {class:'cname' + (c.nn ? '' : ' null'), x:46, y:14}, row, cn + (c.nn ? '' : '?'));
      txt('text', {class:'ctype', x:W - 10, y:14, 'text-anchor':'end'}, row, c.type.toLowerCase());
      if (out) txt('title', {}, row, `→ ${out.to}.${out.tcol}${out.soft ? ' (logical)' : ''} · click to open`);
    });
    if (G.hidden) txt('text', {class:'more', x:12, y:HEAD + G.rows.length * ROW + 14}, card, `+ ${G.hidden} more column${G.hidden > 1 ? 's' : ''}`);
  }
  renderEdges(rels);
  renderMini();
  applySelection();
}

function anchorY(n, col) {
  const G = geo[n], i = G.rows.indexOf(col);
  return i < 0 ? G.y + HEAD / 2 : G.y + HEAD + i * ROW + ROW / 2;
}

function renderEdges(rels) {
  const gE = $('#edges'); gE.innerHTML = '';
  rels.forEach((r, i) => {
    const a = geo[r.from], b = geo[r.to]; if (!a || !b) return;
    const y1 = anchorY(r.from, r.col), y2 = anchorY(r.to, r.tcol);
    let x1, x2, d1, d2;
    if (Math.abs(a.x - b.x) < W) { x1 = a.x + W; x2 = b.x + W; d1 = 1; d2 = 1; }   // same column: loop out to the right
    else if (a.x < b.x) { x1 = a.x + W; x2 = b.x; d1 = 1; d2 = -1; }
    else { x1 = a.x; x2 = b.x + W; d1 = -1; d2 = 1; }
    const k = d1 === d2 ? 36 + Math.min(70, Math.abs(y2 - y1) * 0.12) + (i % 4) * 7 : Math.max(50, Math.abs(x2 - x1) / 2);
    const g = el('g', {class:'edge' + (r.soft ? ' soft' : ''), 'data-from':r.from, 'data-to':r.to, 'data-k':relKey(r)}, gE);
    el('path', {d:`M${x1} ${y1}C${x1 + d1 * k} ${y1} ${x2 + d2 * k} ${y2} ${x2} ${y2}`}, g);
    // child end: crow's foot (many) or a single bar (one)
    const cm = r.one ? `M${x1 + d1 * 8} ${y1 - 6}V${y1 + 6}`
      : `M${x1 + d1 * 12} ${y1}L${x1} ${y1 - 6}M${x1 + d1 * 12} ${y1}L${x1} ${y1 + 6}M${x1 + d1 * 15} ${y1 - 6}V${y1 + 6}`;
    el('path', {class:'mk', d:cm}, g);
    // parent end: exactly one (||) or zero-or-one (o|)
    if (r.nullable) {
      el('circle', {class:'mk', cx:x2 + d2 * 12, cy:y2, r:3.5, fill:'var(--card)'}, g);
      el('path', {class:'mk', d:`M${x2 + d2 * 5} ${y2 - 6}V${y2 + 6}`}, g);
    } else el('path', {class:'mk', d:`M${x2 + d2 * 6} ${y2 - 6}V${y2 + 6}M${x2 + d2 * 10} ${y2 - 6}V${y2 + 6}`}, g);
    txt('title', {}, g, `${r.from}.${r.col} → ${r.to}.${r.tcol}${r.soft ? ' (logical)' : ''}`);
  });
}

/* ---------- minimap ---------- */
const mini = $('#miniSvg');
function renderMini() {
  mini.setAttribute('viewBox', `0 0 ${bounds.w} ${bounds.h}`);
  mini.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  mini.innerHTML = '';
  for (const n in geo) { const G = geo[n]; el('rect', {x:G.x, y:G.y, width:W, height:G.h, rx:12, fill:GROUPS[T[n].group].color, 'fill-opacity':n === selected ? 1 : .45, 'data-t':n}, mini); }
  el('rect', {class:'vw', id:'miniView'}, mini);
  updateMini();
}
function updateMini() {
  const v = document.getElementById('miniView'); if (!v) return;
  const r = svg.getBoundingClientRect();
  v.setAttribute('x', -view.x / view.k); v.setAttribute('y', -view.y / view.k);
  v.setAttribute('width', r.width / view.k); v.setAttribute('height', r.height / view.k);
}
$('#mini').addEventListener('click', e => {
  const pt = mini.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(mini.getScreenCTM().inverse()), r = svg.getBoundingClientRect();
  animateTo({k:view.k, x:r.width / 2 - p.x * view.k, y:r.height / 2 - p.y * view.k});
});

/* ---------- pan / zoom ---------- */
const svg = $('#er'), vp = $('#vp');
let view = {x:0, y:0, k:1}, animId = 0;
const apply = () => { vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); updateMini(); };
const clampK = k => Math.min(2.5, Math.max(0.1, k));
const stopAnim = () => { animId++; };
function animateTo(target, ms = 420) {
  // Timer-driven so the move still completes where requestAnimationFrame is throttled.
  const id = ++animId, from = {...view}, t0 = performance.now();
  const step = () => {
    if (id !== animId) return;
    const p = Math.min(1, (performance.now() - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    view = {x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e, k: from.k + (target.k - from.k) * e};
    apply(); if (p < 1) setTimeout(step, 16);
  };
  step();
}
function canvasSize(open) {
  // Size the canvas will have with the panel open/closed, rather than measuring mid-transition.
  const narrow = innerWidth <= 900, top = 52;
  return {width: narrow ? innerWidth : innerWidth - 260 - (open ? 430 : 0), height: (innerHeight - top) * (narrow && open ? 0.45 : 1)};
}
function fit(animate = true) {
  const r = canvasSize(!!selected);
  const k = clampK(Math.min((r.width - 40) / bounds.w, (r.height - 110) / bounds.h));
  const t = {k, x:(r.width - bounds.w * k) / 2, y:Math.max(50, (r.height - bounds.h * k) / 2)};
  animate ? animateTo(t) : (view = t, apply());
}
function zoomAt(f, cx, cy) {
  stopAnim();
  const k = clampK(view.k * f), s = k / view.k;
  view = {k, x: cx - (cx - view.x) * s, y: cy - (cy - view.y) * s}; apply();
}
function focusTable(n) {
  // Frame the table with its direct neighbours; if that would be too small, frame the table alone.
  const r = canvasSize(true), names = [n, ...neighbours(n)];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  names.forEach(m => { const g = geo[m]; x0 = Math.min(x0, g.x); y0 = Math.min(y0, g.y); x1 = Math.max(x1, g.x + W); y1 = Math.max(y1, g.y + g.h); });
  let k = clampK(Math.min(1.1, (r.width - 80) / (x1 - x0), (r.height - 130) / (y1 - y0)));
  if (k < 0.42) {
    const G = geo[n]; k = 0.85; x0 = G.x; x1 = G.x + W; y0 = G.y; y1 = G.y + Math.min(G.h, (r.height - 130) / k);
  }
  // Centre the framed box, but never let its top slide under the toolbar.
  let y = r.height / 2 - (y0 + y1) / 2 * k + 20;
  if (y0 * k + y < 56) y = 56 - y0 * k;
  animateTo({k, x: r.width / 2 - (x0 + x1) / 2 * k, y});
}

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
}, {passive:false});

let drag = null; const pointers = new Map();
svg.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 2) { const [p, q] = [...pointers.values()]; drag = {pinch:Math.hypot(p.x - q.x, p.y - q.y), moved:99}; return; }
  stopAnim();
  drag = {sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y, moved:0, target:e.target};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (drag.pinch) {
    if (pointers.size !== 2) return;
    const [p, q] = [...pointers.values()], d = Math.hypot(p.x - q.x, p.y - q.y), r = svg.getBoundingClientRect();
    zoomAt(d / drag.pinch, (p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top); drag.pinch = d; return;
  }
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
  if (drag.moved > 4) { svg.classList.add('panning'); view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
});
svg.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (!drag) return;
  svg.classList.remove('panning');
  const d = drag; drag = null;
  if (d.moved <= 4 && d.target) onCanvasClick(d.target);
});
svg.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); drag = null; svg.classList.remove('panning'); });

function onCanvasClick(target) {
  const card = target.closest('.card');
  if (!card) return go(null);
  const n = card.dataset.t, row = target.closest('.row');
  if (row) {
    const r = visibleRels().find(r => r.from === n && r.col === row.dataset.c);
    return r ? go(r.to, r.tcol) : go(n, row.dataset.c);
  }
  go(n);
}

/* ---------- selection & navigation ---------- */
let selected = null, selCol = null, tab = 'diagram';
const trail = [];
function neighbours(n) {
  const s = new Set();
  visibleRels().forEach(r => { if (r.from === n) s.add(r.to); if (r.to === n) s.add(r.from); });
  s.delete(n); return [...s];
}
function go(n, col) {
  const h = n ? '#' + n + (col ? '/' + col : '') : '';
  if (location.hash !== h) location.hash = h; else fromHash();
}
function fromHash() {
  const raw = decodeURIComponent(location.hash.slice(1)).trim();
  if (raw === 'mappings') { setTab('maps'); return; }
  setTab('diagram');
  const [n, col] = raw.split('/');
  if (n && T[n]) { selected = n; selCol = col || null; } else { selected = null; selCol = null; }
  if (selected) { const i = trail.indexOf(selected); if (i >= 0) trail.splice(i, 1); trail.push(selected); if (trail.length > 7) trail.shift(); }
  applySelection(); renderPanel(); renderTrail(); renderMini();
  selected ? focusTable(selected) : fit();
}
function applySelection() {
  const rel = new Set(selected ? neighbours(selected) : []);
  $('#vp').classList.toggle('dimmed', !!selected);
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('sel', c.dataset.t === selected);
    c.classList.toggle('rel', rel.has(c.dataset.t));
    c.querySelectorAll('.row').forEach(r => r.classList.toggle('flash', c.dataset.t === selected && r.dataset.c === selCol));
  });
  document.querySelectorAll('.edge').forEach(e => e.classList.toggle('hi', !!selected && (e.dataset.from === selected || e.dataset.to === selected)));
  document.querySelectorAll('.item').forEach(i => { i.classList.toggle('active', i.dataset.t === selected); i.classList.toggle('rel', rel.has(i.dataset.t)); });
  const act = document.querySelector('.item.active'); if (act) act.scrollIntoView({block:'nearest'});
  $('#app').classList.toggle('open', !!selected && tab === 'diagram');
}
function renderTrail() {
  const el = $('#trail');
  el.innerHTML = trail.length ? trail.map((n, i) => `${i ? '<span class="sep">›</span>' : ''}<button data-go="${n}" class="${n === selected ? 'cur' : ''}">${n.replace(/^HD_/, '')}</button>`).join('') : '';
}
$('#trail').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });

const cardinality = r => r.one ? 'one-to-one' : 'many-to-one';
function relButton(r, dir) {
  const other = dir === 'out' ? r.to : r.from, col = dir === 'out' ? r.tcol : r.col;
  const label = dir === 'out'
    ? `<span>${r.col}</span><span class="muted">→</span><span class="card-t">${r.to.replace(/^HD_/, '')}</span>`
    : `<span class="card-t">${r.from.replace(/^HD_/, '')}</span><span class="muted">.${r.col}</span>`;
  return `<button class="relbtn" data-go="${other}" data-col="${col}" title="${esc(r.note || cardinality(r))}">${label}<span class="tag ${r.soft ? 't-lr' : 't-fk'}">${r.soft ? 'logical' : (r.one ? '1 : 1' : 'N : 1')}</span></button>`;
}
function renderPanel() {
  const P = $('#panel');
  if (!selected) { P.innerHTML = ''; return; }
  const t = T[selected], g = GROUPS[t.group];
  const out = RELS.filter(r => r.from === t.name && !r.org), inc = RELS.filter(r => r.to === t.name && !r.org);
  const orgInc = RELS.filter(r => r.to === t.name && r.org).length;
  const rows = t.columns.map(c => {
    const r = RELS.find(r => r.from === t.name && r.col === c.name), b = [];
    if (c.pk) b.push('<span class="badge b-pk">PK</span>');
    if (c.fk) b.push('<span class="badge b-fk">FK</span>');
    if (r && r.soft) b.push('<span class="badge b-lr" title="Logical reference, not enforced">LR</span>');
    if (c.nn && !c.pk) b.push('<span class="badge b-nn">NN</span>');
    if (c.uq) b.push('<span class="badge b-uq">UQ</span>');
    const subs = [];
    if (r) subs.push(`→ <button class="lnk" data-go="${r.to}" data-col="${r.tcol}">${r.to}.${r.tcol}</button>${r.soft ? ` <span class="muted">(logical: ${esc(r.note)})</span>` : ''}${r.indexed || r.org ? '' : ' <span class="warn" title="No index starts with this column">· not indexed</span>'}`);
    if (c.def) subs.push(`default <code>${esc(c.def)}</code>`);
    if (c.check) subs.push(`check <code>${esc(c.check)}</code>`);
    if (c.note) subs.push(esc(c.note));
    return `<tr data-c="${c.name}" class="${c.name === selCol ? 'flash' : ''}"><td><div class="n">${esc(c.name)}</div>${subs.length ? `<div class="sub">${subs.join('<br>')}</div>` : ''}</td><td class="t">${c.type.toLowerCase()}</td><td style="white-space:nowrap;text-align:right">${b.join('')}</td></tr>`;
  }).join('');
  P.innerHTML = `
    <div class="panel-head"><h2>${t.name}</h2><button data-close title="Close (Esc)">✕</button></div>
    <div class="panel-body">
      <div class="meta"><span class="pill"><span class="dot" style="background:${g.color}"></span>${g.name}</span><span class="mono">${t.file}</span><span>${t.columns.length} columns</span></div>
      ${t.desc ? `<p class="desc">${esc(t.desc)}</p>` : ''}
      <h3>Points to (${out.length})</h3>
      ${out.length ? `<div class="rels">${out.map(r => relButton(r, 'out')).join('')}</div>` : '<div class="empty">No outgoing references besides Org_Id.</div>'}
      <h3>Referenced by (${inc.length})</h3>
      ${inc.length ? `<div class="rels">${inc.map(r => relButton(r, 'in')).join('')}</div>` : '<div class="empty">Nothing references this table.</div>'}
      ${orgInc ? `<div class="sub" style="margin-top:6px">…plus the Org_Id column of ${orgInc} tables.</div>` : ''}
      <h3>Columns</h3>
      <table class="cols">${rows}</table>
      ${t.compositePk ? `<h3>Composite primary key</h3><div class="idx">PRIMARY KEY (${esc(t.compositePk.join(', '))})</div>` : ''}
      ${t.checks.length ? `<h3>Table checks</h3>${t.checks.map(c => `<div class="idx">CHECK (${esc(c)})</div>`).join('')}` : ''}
      <h3>Indexes (${t.indexes.length})</h3>
      ${t.indexes.length ? t.indexes.map(ix => `<div class="idx">${esc(ix.name)}${ix.unique ? ' <span class="badge b-uq">UNIQUE</span>' : ''}<div class="sub"><code>(${esc(ix.cols)})</code>${ix.where ? ` WHERE <code>${esc(ix.where)}</code>` : ''}</div></div>`).join('') : '<div class="empty">Primary key only.</div>'}
    </div>`;
  const fl = P.querySelector('tr.flash'); if (fl) fl.scrollIntoView({block:'center'});
}
document.addEventListener('click', e => {
  if (e.target.closest('#panel [data-close]')) return go(null);
  const b = e.target.closest('#panel [data-go], #mapView [data-go]');
  if (b) go(b.dataset.go, b.dataset.col);
});

/* ---------- mappings view ---------- */
let mapFilter = 'all';
function renderMaps() {
  const q = $('#q').value.trim().toLowerCase();
  const tests = {all:r => !r.org, fk:r => !r.soft && !r.org, logical:r => r.soft, one:r => r.one, unindexed:r => !r.indexed && !r.org, org:r => r.org};
  const list = RELS.filter(tests[mapFilter]).filter(r => !q || `${r.from}.${r.col} ${r.to}.${r.tcol}`.toLowerCase().includes(q))
    .sort((a, b) => a.from.localeCompare(b.from) || a.col.localeCompare(b.col));
  const count = f => RELS.filter(tests[f]).length;
  const chip = (f, label) => `<button data-f="${f}" class="${mapFilter === f ? 'on' : ''}">${label} · ${count(f)}</button>`;
  $('#mapView').innerHTML = `
    <div class="mapHead"><h2>All mappings</h2><p>Every column that points at another table. Click a row to open it on the diagram.</p></div>
    <div class="filters">${chip('all', 'All')}${chip('fk', 'Foreign keys')}${chip('logical', 'Logical')}${chip('one', 'One-to-one')}${chip('unindexed', 'Not indexed')}${chip('org', 'Org_Id')}</div>
    <table class="maps">
      <thead><tr><th>From column</th><th>To column</th><th>Kind</th><th>Cardinality</th><th>Required</th><th>Indexed</th></tr></thead>
      <tbody>${list.map(r => `<tr>
        <td class="ref"><button class="lnk" data-go="${r.from}" data-col="${r.col}">${r.from}.<b>${r.col}</b></button></td>
        <td class="ref"><button class="lnk" data-go="${r.to}" data-col="${r.tcol}">${r.to}.<b>${r.tcol}</b></button>${r.note ? `<div class="sub">${esc(r.note)}</div>` : ''}</td>
        <td><span class="tag ${r.soft ? 't-lr' : 't-fk'}">${r.soft ? 'Logical' : 'FK'}</span></td>
        <td>${cardinality(r)}</td>
        <td>${r.nullable ? '<span class="muted">optional</span>' : 'required'}</td>
        <td>${r.indexed ? '<span class="t-ok">yes</span>' : '<span class="t-no">no</span>'}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No mappings match.</td></tr>'}</tbody>
    </table>`;
}
$('#mapView').addEventListener('click', e => { const f = e.target.closest('[data-f]'); if (f) { mapFilter = f.dataset.f; renderMaps(); } });
function setTab(tn) {
  tab = tn;
  $('#app').classList.toggle('maps', tn === 'maps');
  $('#tabDiagram').classList.toggle('on', tn === 'diagram');
  $('#tabMaps').classList.toggle('on', tn === 'maps');
  if (tn === 'maps') { $('#app').classList.remove('open'); renderMaps(); }
}
$('#tabDiagram').onclick = () => { if (tab !== 'diagram') { location.hash = selected ? selected : ''; if (!selected) fromHash(); } };
$('#tabMaps').onclick = () => { location.hash = 'mappings'; };

/* ---------- sidebar ---------- */
function renderList() {
  const q = $('#q').value.trim().toLowerCase();
  let html = '';
  GROUPS.forEach(g => {
    const items = g.tables.filter(n => !q || n.toLowerCase().includes(q) || T[n].columns.some(c => c.name.toLowerCase().includes(q)));
    if (!items.length) return;
    html += `<div class="grp"><span class="dot" style="background:${g.color}"></span>${g.name}</div>`;
    html += items.map(n => `<button class="item" data-t="${n}"><span>${n.replace(/^HD_/, '')}</span><span>${T[n].columns.length}</span></button>`).join('');
  });
  $('#list').innerHTML = html || '<div class="empty" style="padding:12px 14px">No match.</div>';
  applySelection();
  if (tab === 'maps') renderMaps();
}
$('#list').addEventListener('click', e => { const i = e.target.closest('.item'); if (i) { go(i.dataset.t); $('#app').classList.remove('menu'); } });
$('#q').addEventListener('input', renderList);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && tab === 'diagram') { const f = document.querySelector('.item'); if (f) go(f.dataset.t); } });

/* ---------- controls ---------- */
const center = () => { const r = svg.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
$('#zin').onclick = () => zoomAt(1.25, ...center());
$('#zout').onclick = () => zoomAt(0.8, ...center());
$('#fit').onclick = () => fit();
$('#menuBtn').onclick = () => $('#app').classList.toggle('menu');
$('#themeBtn').onclick = () => {
  const root = document.documentElement, dark = getComputedStyle(root).colorScheme.includes('dark');
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('er-theme', root.dataset.theme); } catch (_) {}
};
try { const th = localStorage.getItem('er-theme'); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
const setMode = all => {
  opt.all = all; $('#modeAll').classList.toggle('on', all); $('#modeKeys').classList.toggle('on', !all);
  render(); selected ? focusTable(selected) : fit();
};
$('#modeKeys').onclick = () => setMode(false);
$('#modeAll').onclick = () => setMode(true);
$('#optOrg').onchange = e => { opt.org = e.target.checked; render(); renderPanel(); };
$('#optSoft').onchange = e => { opt.soft = e.target.checked; render(); renderPanel(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.activeElement === $('#q') && $('#q').value) { $('#q').value = ''; renderList(); } else if (tab === 'diagram') go(null); }
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', fromHash);
window.addEventListener('resize', () => { if (!selected) fit(false); else updateMini(); });

/* ---------- boot ---------- */
const fkCount = RELS.filter(r => !r.soft && !r.org).length, softCount = RELS.filter(r => r.soft).length;
$('#stats').textContent = `${SCHEMA.length} tables · ${SCHEMA.reduce((n, t) => n + t.columns.length, 0)} columns · ${fkCount} foreign keys · ${softCount} logical links · Org_Id on ${RELS.filter(r => r.org).length} tables`;
render(); renderList(); fit(false);
if (location.hash.length > 1) fromHash();
</script>
</body>
</html>
